                    with:
                          version: v2.6.2
                          skip-cache: true

      security_scan:
            name: Security Scan
            runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                  - name: Run Gosec Security Scanner
                    uses: securego/gosec@master
                    with:
                          args: ./...

      build:
            name: Build & Test
            runs-on: ubuntu-latest
            needs: [golangci, security_scan]
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-go@v4
                    with:
                          go-version: "1.26"

                  - name: Build
                    run: go build -v ./...

                  - name: Test
                    run: go test -v ./...
