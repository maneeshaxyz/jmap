name: CI Pipeline

on:
      push:
            branches:
                  - main

      pull_request:
            branches:
                  - main

permissions:
      contents: read
      pull-requests: read
      security-events: write

jobs:
      golangci:
            name: Lint
            runs-on: ubuntu-latest

            steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5

                  - name: Setup Go
                    uses: actions/setup-go@v6
                    with:
                          go-version-file: go.mod

                  - name: Verify Go version
                    run: go version

                  - name: Run golangci-lint
                    uses: golangci/golangci-lint-action@v9
                    with:
                          version: v2.12

      security_scan:
            name: Security Scan
            runs-on: ubuntu-latest

            steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5

                  - name: Setup Go
                    uses: actions/setup-go@v6
                    with:
                          go-version-file: go.mod

                  - name: Run Gosec Security Scanner
                    uses: securego/gosec@master
                    with:
                          args: ./...

      build:
            name: Build & Test
            runs-on: ubuntu-latest
            needs:
                  - golangci
                  - security_scan

            steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5

                  - name: Setup Go
                    uses: actions/setup-go@v6
                    with:
                          go-version-file: go.mod

                  - name: Verify Go version
                    run: go version

                  - name: Download dependencies
                    run: go mod download

                  - name: Build
                    run: go build -v ./...

                  - name: Test
                    run: go test -v ./...
