name: CI Pipeline

on:
      push:
            branches: ["main"]
      pull_request:
            branches: ["main"]

permissions:
      contents: read
      pull-requests: read
      security-events: write

jobs:
      golangci:
            name: Lint
            runs-on: ubuntu-latest
